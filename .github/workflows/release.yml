name: release

# Images are published only from a manual, reviewer-gated run or a version tag.
# A push to main never publishes.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images to GHCR (requires environment approval)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via OIDC

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Requires a GitHub Environment with required reviewers. Even a dry run
    # needs approval, so no image can be published without a human gate.
    environment: ghcr-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: veronica-ai-gateway
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to build with credentials in the context
        run: ./scripts/check-build-context.sh

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !(inputs.publish == true || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Scan (report; fail on CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Fail on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

      - name: Sign (keyless)
        if: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/') }}
        uses: sigstore/cosign-installer@v3

      - name: Sign published digest
        if: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/') }}
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "signing $digest"
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}@${digest}"

      - name: Record digest
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
