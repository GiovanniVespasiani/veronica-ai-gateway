# TEMPLATE ONLY. Do not apply. Do not commit real values.
#
# Two independent Secrets, rotated separately:
#
#   kubectl create secret generic ai-gateway-client -n ai-gateway \
#     --from-literal=client-token="$(openssl rand -hex 32)"
#
#   kubectl create secret generic ai-gateway-provider -n ai-gateway \
#     --from-literal=provider-key="<OpenCode Go personal API key>"
#
# The client token is configured into n8n as N8N_INSTANCE_AI_MODEL_API_KEY.
# The provider key must never exist in the n8n namespace.
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-client
  namespace: ai-gateway
type: Opaque
stringData:
  client-token: "REPLACE_WITH_RANDOM_32_BYTES_HEX"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-provider
  namespace: ai-gateway
type: Opaque
stringData:
  provider-key: "REPLACE_WITH_OPENCODE_GO_PERSONAL_API_KEY"
