apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: veronica
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
        app.kubernetes.io/part-of: veronica
    spec:
      serviceAccountName: ai-gateway
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Phase B1 built this image locally:
          #   manifest list sha256:1e44f3ca70ccec7c9925aa1dbdebeb94b3ae91f0df4269614c77c7e0c154c858
          #   config        sha256:3491bf9d4e7644f2c801b7cc6107e6753516d8693232affa5f6a56daa87495fd
          # A registry push is still required (blocker B7). The digest below is a
          # deliberate non-functional placeholder: deploying it fails the image
          # pull rather than silently running a mutable tag.
          image: ghcr.io/example/veronica-ai-gateway:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_LISTEN_ADDR
              value: ":8080"
            - name: GATEWAY_CLIENT_TOKEN_FILE
              value: /var/run/secrets/ai-gateway-client/client-token
            - name: GATEWAY_UPSTREAM_TOKEN_FILE
              value: /var/run/secrets/ai-gateway-provider/provider-key
            # Strict header mode: the client must send a stable conversation id.
            # "unavailable" is the fail-closed alternative.
            - name: GATEWAY_SESSION_MODE
              value: header
            - name: GATEWAY_MODEL
              value: deepseek-v4.1-flash
            - name: GATEWAY_MAX_BODY_BYTES
              value: "4194304"
            - name: GATEWAY_MAX_INFLIGHT
              value: "8"
            - name: GATEWAY_RATE_PER_MINUTE
              value: "300"
            - name: GATEWAY_RATE_BURST
              value: "60"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: client-secret
              mountPath: /var/run/secrets/ai-gateway-client
              readOnly: true
            - name: provider-secret
              mountPath: /var/run/secrets/ai-gateway-provider
              readOnly: true
      volumes:
        - name: client-secret
          secret:
            secretName: ai-gateway-client
            defaultMode: 0400
            items:
              - key: client-token
                path: client-token
        - name: provider-secret
          secret:
            secretName: ai-gateway-provider
            defaultMode: 0400
            items:
              - key: provider-key
                path: provider-key
      terminationGracePeriodSeconds: 30
